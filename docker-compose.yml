version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: musicstream-db
    environment:
      POSTGRES_DB: musicstream_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zakaria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - musicstream-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musicstream-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/musicstream_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: zakaria
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      STORAGE_UPLOAD_DIR: /app/uploads/
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - musicstream-network
    restart: unless-stopped

  # Angular Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: musicstream-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - musicstream-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  musicstream-network:
    driver: bridge
