<div class="home-page">
    <div class="container">
        <!-- Header -->
        <header class="page-header">
            <div class="header-content">
                <h1 class="gradient-text">MusicStream</h1>
                <p class="subtitle">Your personal music collection</p>
            </div>
        </header>

        <!-- Error Message -->
        <div class="error-banner" *ngIf="error()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ error() }}</span>
            <button class="btn-icon" (click)="loadTracks()" title="Retry">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
        </div>

        <!-- Loading State -->
        <div class="loading-container" *ngIf="isLoading()">
            <div class="loading-spinner"></div>
            <p>Loading tracks...</p>
        </div>

        <!-- Empty State -->
        <div class="empty-state" *ngIf="!isLoading() && tracks().length === 0 && !error()">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <h2>No tracks yet</h2>
            <p>Start building your music collection by adding your first track</p>
            <button class="btn btn-primary" (click)="onAddTrack()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Add Your First Track
            </button>
        </div>

        <!-- Tracks Grid -->
        <div class="tracks-grid" *ngIf="!isLoading() && tracks().length > 0">
            <app-track-card *ngFor="let track of tracks()" [track]="track" [isPlaying]="isTrackPlaying(track)"
                (play)="onPlayTrack($event)" (edit)="onEditTrack($event)"
                (delete)="onDeleteTrack($event)"></app-track-card>
        </div>

        <!-- Floating Action Button -->
        <button class="fab" (click)="onAddTrack()" *ngIf="tracks().length > 0" title="Add new track">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <!-- Track Dialog -->
        <app-track-dialog [isOpen]="isDialogOpen()" [track]="selectedTrack()" [isLoading]="isSaving()"
            (submit)="onDialogSubmit($event)" (close)="onDialogClose()"></app-track-dialog>
    </div>
</div>
