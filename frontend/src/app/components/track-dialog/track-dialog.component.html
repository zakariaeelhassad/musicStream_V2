<div *ngIf="isOpen" class="fixed inset-0 z-[2000] flex items-center justify-center p-4 animate-fade-in"
    (click)="onBackdropClick($event)">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>

    <!-- Dialog -->
    <div class="relative w-full max-w-2xl glass rounded-xl shadow-2xl max-h-[90vh] overflow-y-auto animate-slide-up"
        #dialogContent>
        <!-- Close Button -->
        <button
            class="absolute top-4 right-4 w-10 h-10 rounded-full bg-bg-tertiary border border-slate-700 flex items-center justify-center text-slate-400 hover:text-red-500 hover:border-red-500 hover:rotate-90 transition-all z-10"
            (click)="onClose()" title="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <!-- Form -->
        <app-track-form [track]="track" [isLoading]="isLoading" (submit)="onSubmit($event)"
            (cancel)="onClose()"></app-track-form>
    </div>
</div>
