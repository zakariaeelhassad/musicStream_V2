<div class="px-8 py-6">
    <h2 class="text-2xl font-semibold mb-8 gradient-text">
        {{ isEditMode ? 'Edit Track' : 'Add New Track' }}
    </h2>

    <form [formGroup]="trackForm" (ngSubmit)="onSubmit()">
        <!-- Title -->
        <div class="mb-6">
            <label for="title" class="block mb-2 text-sm font-medium text-slate-300">Title *</label>
            <input id="title" type="text" formControlName="title" placeholder="Enter track title" class="input"
                [class.border-red-500]="title?.invalid && title?.touched" />
            <div *ngIf="title?.invalid && title?.touched" class="mt-1 text-xs text-red-400">
                <span *ngIf="title?.errors?.['required']">Title is required</span>
                <span *ngIf="title?.errors?.['maxlength']">Title must be less than 50 characters</span>
            </div>
        </div>

        <!-- Artist -->
        <div class="mb-6">
            <label for="artist" class="block mb-2 text-sm font-medium text-slate-300">Artist *</label>
            <input id="artist" type="text" formControlName="artist" placeholder="Enter artist name" class="input"
                [class.border-red-500]="artist?.invalid && artist?.touched" />
            <div *ngIf="artist?.invalid && artist?.touched" class="mt-1 text-xs text-red-400">
                <span *ngIf="artist?.errors?.['required']">Artist is required</span>
                <span *ngIf="artist?.errors?.['maxlength']">Artist must be less than 50 characters</span>
            </div>
        </div>

        <!-- Category -->
        <div class="mb-6">
            <label for="category" class="block mb-2 text-sm font-medium text-slate-300">Category *</label>
            <select id="category" formControlName="category" class="input">
                <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
            </select>
        </div>

        <!-- Description -->
        <div class="mb-6">
            <label for="description" class="block mb-2 text-sm font-medium text-slate-300">Description</label>
            <textarea id="description" formControlName="description" placeholder="Enter track description (optional)"
                rows="3" class="input resize-none"
                [class.border-red-500]="description?.invalid && description?.touched"></textarea>
            <div *ngIf="description?.invalid && description?.touched" class="mt-1 text-xs text-red-400">
                <span *ngIf="description?.errors?.['maxlength']">Description must be less than 200 characters</span>
            </div>
        </div>

        <!-- Audio File -->
        <div class="mb-6">
            <label for="audioFile" class="block mb-2 text-sm font-medium text-slate-300">
                Audio File {{ isEditMode ? '(optional - leave empty to keep current)' : '' }}
            </label>
            <div class="relative">
                <input id="audioFile" type="file" accept="audio/*" (change)="onFileSelected($event)"
                    class="absolute w-0 h-0 opacity-0 overflow-hidden -z-10" />
                <label for="audioFile"
                    class="flex items-center gap-2 px-4 py-3 bg-bg-tertiary border-2 border-dashed border-slate-700 rounded-md cursor-pointer transition-all hover:border-primary hover:bg-bg-tertiary/70 hover:text-primary text-slate-400 text-sm">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span>{{ fileName || 'Choose audio file' }}</span>
                </label>
            </div>
            <p *ngIf="!isEditMode" class="flex items-center gap-1 mt-2 text-xs text-slate-500">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                You can add the audio file now or upload it later
            </p>
        </div>

        <!-- Actions -->
        <div class="flex gap-4 justify-end pt-6 border-t border-slate-700">
            <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isLoading">
                Cancel
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="trackForm.invalid || isLoading">
                <span *ngIf="!isLoading">{{ isEditMode ? 'Update Track' : 'Create Track' }}</span>
                <span *ngIf="isLoading" class="flex items-center gap-2">
                    <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin-slow"></span>
                    {{ isEditMode ? 'Updating...' : 'Creating...' }}
                </span>
            </button>
        </div>
    </form>
</div>
