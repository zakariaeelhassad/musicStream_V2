<div class="card relative overflow-hidden group">
    <!-- Accent Border for Playing State -->
    <div *ngIf="isPlaying" class="absolute top-0 left-0 right-0 h-0.5 bg-gradient-to-r from-primary to-secondary"></div>

    <!-- Header -->
    <div class="flex items-center gap-4 mb-4">
        <button class="w-12 h-12 rounded-full flex-shrink-0 flex items-center justify-center transition-all border"
            [class.bg-gradient-to-r]="isPlaying" [class.from-primary]="isPlaying" [class.to-secondary]="isPlaying"
            [class.border-transparent]="isPlaying" [class.shadow-lg]="isPlaying" [class.bg-bg-tertiary]="!isPlaying"
            [class.border-slate-700]="!isPlaying" [class.hover:bg-gradient-to-r]="!isPlaying"
            [class.hover:from-primary]="!isPlaying" [class.hover:to-secondary]="!isPlaying"
            [class.hover:border-transparent]="!isPlaying" [class.hover:scale-110]="!isPlaying" (click)="onPlay()">
            <svg *ngIf="!isPlaying" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" class="text-slate-50">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg *ngIf="isPlaying" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" class="text-white">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
        </button>

        <div class="flex-1 min-w-0">
            <h3 class="text-lg font-semibold text-slate-50 mb-1 truncate">{{ track.title }}</h3>
            <p class="text-sm text-slate-400 truncate">{{ track.artist }}</p>
        </div>
    </div>

    <!-- Meta -->
    <div class="flex items-center gap-4 mb-4">
        <span
            class="inline-block px-2 py-1 glass border border-slate-700 rounded-full text-xs font-medium text-primary">
            {{ track.category }}
        </span>
        <span class="text-sm text-slate-500 font-mono">{{ formatDuration(track.duration) }}</span>
    </div>

    <!-- Description -->
    <p *ngIf="track.description" class="text-sm text-slate-400 mb-4 line-clamp-2">
        {{ track.description }}
    </p>

    <!-- Actions -->
    <div class="flex gap-2 pt-4 border-t border-slate-700">
        <button class="btn-icon" (click)="onEdit()" title="Edit track">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        </button>
        <button class="btn-icon hover:bg-red-500/10 hover:border-red-500 hover:text-red-500" (click)="onDelete()"
            title="Delete track">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        </button>
    </div>

    <!-- No Audio Indicator -->
    <div *ngIf="!track.fileUrl"
        class="flex items-center gap-2 px-3 py-2 bg-yellow-500/10 border border-yellow-500/30 rounded-md text-yellow-400 text-xs mt-4">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>No audio file</span>
    </div>
</div>
