<div *ngIf="currentTrack$ | async as currentTrack"
    class="fixed bottom-0 left-0 right-0 glass border-t border-slate-700 z-[1500] animate-slide-up">
    <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-8 items-center">

        <!-- Track Info Section -->
        <div class="flex flex-col gap-1 min-w-0">
            <div class="text-xs uppercase tracking-wider text-primary font-semibold">Now Playing</div>
            <div class="min-w-0">
                <h4 class="text-sm font-semibold text-slate-50 truncate">{{ currentTrack.title }}</h4>
                <p class="text-xs text-slate-400 truncate">{{ currentTrack.artist }}</p>
            </div>
        </div>

        <!-- Player Controls Section -->
        <div class="flex flex-col gap-2 items-center">
            <div class="flex items-center gap-4">
                <button
                    class="w-9 h-9 rounded-full flex items-center justify-center text-slate-50 hover:text-primary transition-all hover:scale-110 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100"
                    (click)="previous()" [disabled]="!(hasPrevious$ | async)" title="Previous track">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5"></line>
                    </svg>
                </button>

                <button
                    class="w-11 h-11 rounded-full bg-gradient-to-r from-primary to-secondary text-white flex items-center justify-center shadow-md hover:shadow-lg hover:scale-110 transition-all"
                    (click)="togglePlayPause()" [title]="(isPlaying$ | async) ? 'Pause' : 'Play'">
                    <svg *ngIf="!(isPlaying$ | async)" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <svg *ngIf="isPlaying$ | async" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                </button>

                <button
                    class="w-9 h-9 rounded-full flex items-center justify-center text-slate-50 hover:text-primary transition-all hover:scale-110 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100"
                    (click)="next()" [disabled]="!(hasNext$ | async)" title="Next track">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </button>
            </div>

            <div class="flex items-center gap-3 w-full">
                <span class="text-xs text-slate-500 font-mono min-w-[40px] text-center">
                    {{ formatTime((currentTime$ | async) || 0) }}
                </span>
                <div class="flex-1 h-1.5 bg-bg-tertiary rounded-full cursor-pointer relative group"
                    (click)="onProgressClick($event)">
                    <div class="h-full bg-gradient-to-r from-primary to-secondary rounded-full transition-all relative"
                        [style.width.%]="(progress$ | async) || 0">
                        <div
                            class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-md opacity-0 group-hover:opacity-100 transition-opacity">
                        </div>
                    </div>
                </div>
                <span class="text-xs text-slate-500 font-mono min-w-[40px] text-center">
                    {{ formatTime((duration$ | async) || 0) }}
                </span>
            </div>
        </div>

        <!-- Volume Section -->
        <div class="hidden md:flex items-center gap-3 justify-end">
            <svg class="text-slate-400 flex-shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <input type="range" min="0" max="1" step="0.01" [value]="(volume$ | async) || 0.7"
                (input)="onVolumeChange($event)"
                class="w-24 h-1 bg-bg-tertiary rounded-full appearance-none cursor-pointer [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:bg-primary [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:transition-all [&::-webkit-slider-thumb]:hover:scale-125" />
        </div>
    </div>
</div>
